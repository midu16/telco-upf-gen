# Web UI: Deployment + Service + Route.
#
# The dashboard fans out to every UPF and traffic-generator control-lite
# endpoint (headless DNS, 1:1 addresses) and renders the live N3/N5/N9
# fabric view.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: telco
  labels:
    app: webui
    app.kubernetes.io/part-of: telco-upf-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
        app.kubernetes.io/part-of: telco-upf-gen
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        securityContextConstraints:
          name: upf-udp
      containers:
        - name: webui
          image: quay.io/midu/webui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            - name: ADDR
              value: ":8080"
            - name: UPF_ENDPOINTS
              value: >-
                upf-0=http://upf-0.upf-hs.telco.svc.cluster.local:8080,
                upf-1=http://upf-1.upf-hs.telco.svc.cluster.local:8080
            - name: TG_ENDPOINTS
              value: >-
                tg-0=http://trafficgen-0.tg-hs.telco.svc.cluster.local:8080,
                tg-1=http://trafficgen-1.tg-hs.telco.svc.cluster.local:8080
            # Sole store writer. Keep in sync with deploy/db.yaml envs
            # (POSTGRESQL_USER/POSTGRESQL_PASSWORD/POSTGRESQL_DATABASE) and
            # the Makefile / e2e defaults (DB_USER/DB_PASSWORD/DB_NAME).
            - name: DB_DSN
              value: postgres://upfgen:postgres@db.telco.svc.cluster.local:5432/telco_upf?sslmode=disable
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: telco
  labels:
    app: webui
    app.kubernetes.io/part-of: telco-upf-gen
spec:
  selector:
    app: webui
  ports:
    - { name: http, port: 80, targetPort: 8080, protocol: TCP }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: webui
  namespace: telco
  labels:
    app: webui
    app.kubernetes.io/part-of: telco-upf-gen
spec:
  to:
    kind: Service
    name: webui
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

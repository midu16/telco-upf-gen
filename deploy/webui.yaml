# Web UI: Deployment + Service + Route.
#
# The dashboard fans out to every UPF and traffic-generator control-lite
# endpoint (headless DNS, 1:1 addresses) and renders the live N3/N5/N9
# fabric view.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: telco
  labels:
    app: webui
    app.kubernetes.io/part-of: telco-upf-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
        app.kubernetes.io/part-of: telco-upf-gen
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        securityContextConstraints:
          name: upf-udp
      containers:
        - name: webui
          image: quay.io/midu/webui:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            # DB_DSN is the only store credential; keep it in sync with the
            # POSTGRESQL_* envs in deploy/db.yaml and the Makefile/e2e
            # defaults (DB_USER=upfgen, DB_PASSWORD=postgres, DB_NAME=telco_upf).
            - name: DB_DSN
              value: postgres://upfgen:postgres@db.telco.svc.cluster.local:5432/telco_upf?sslmode=disable
          envFrom:
            - configMapRef:
                name: webui-env
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: telco
  labels:
    app: webui
    app.kubernetes.io/part-of: telco-upf-gen
spec:
  selector:
    app: webui
  ports:
    - { name: http, port: 80, targetPort: 8080, protocol: TCP }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: webui
  namespace: telco
  labels:
    app: webui
    app.kubernetes.io/part-of: telco-upf-gen
spec:
  to:
    kind: Service
    name: webui
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

name: build-and-push

# Every push to every branch runs the checks; pushed refs to the default
# branch additionally roll the :latest tag. Each build is tagged with its
# commit so any deployed environment can pin an exact change.
on:
  push:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (multi-arch adds slow QEMU builds)"
        required: false
        default: linux/amd64

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  IMAGE_OWNER: midu

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fmt (gofmt must leave the tree untouched)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build binaries
        run: go build ./...
      - name: test
        run: go test ./...
        timeout-minutes: 5

  images:
    needs: test
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: upf, file: upf.Containerfile }
          - { app: trafficgen, file: trafficgen.Containerfile }
          - { app: webui, file: webui.Containerfile }

    steps:
      - uses: actions/checkout@v4

      # Fail with an actionable message instead of docker/login-action's
      # bare "Username and password required" (empty secrets resolve to
      # empty strings; this makes the remediation obvious).
      - name: Guard Quay credentials
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [ -z "$QUAY_USERNAME" ] || [ -z "$QUAY_PASSWORD" ]; then
            echo "::error::Repository secrets 'QUAY_USERNAME' and 'QUAY_PASSWORD' are missing or empty."
            echo "        Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "Quay credentials present (user: $QUAY_USERNAME)"

      # Fail fast with an actionable message instead of the daemon's bare
      # "401 Unauthorized" from login-action: probe the registry auth
      # endpoint directly and verify the robot token + push scope for the
      # image repos. Secrets are passed via --config stdin (not argv).
      - name: Preflight Quay auth (token validity + push scope)
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          set -euo pipefail
          code=$(printf 'url = "https://quay.io/v2/auth?service=quay.io&scope=repository:%s/upf:push,pull"\nuser = "%s:%s"\n' \
            "$IMAGE_OWNER" "$QUAY_USERNAME" "$QUAY_PASSWORD" \
            | curl -sS -o /dev/null -w '%{http_code}' --config -) || code=000
          if [ "$code" != "200" ]; then
            echo "::error::quay.io rejected the stored credentials (HTTP $code)."
            echo "  Use a Quay robot account: QUAY_USERNAME = owner+rname (e.g. ${IMAGE_OWNER}+ci),"
            echo "  QUAY_PASSWORD = its token; regenerate the token on quay.io (Robot Accounts)"
            echo "  and re-set both secrets, then re-run this workflow."
            exit 1
          fi
          echo "quay.io auth OK: token valid, push scope granted for ${IMAGE_OWNER}/upf"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # One OCI image per commit: rolling branch tag + :latest on main +
      # immutable sha-<commit> tag for pinning deployments.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

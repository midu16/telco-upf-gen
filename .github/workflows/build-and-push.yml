name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-push
  cancel-in-progress: false

env:
  REGISTRY: quay.io
  IMAGE_OWNER: midu

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  build-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push upf (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: upf.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/upf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push trafficgen (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trafficgen.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trafficgen:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push webui (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webui.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/webui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
